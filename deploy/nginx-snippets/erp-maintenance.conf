# Maintenance mode for this site. Toggle with: bash deploy/maintenance-mode.sh on|off
#
# ON:  every request gets deploy/maintenance.html with HTTP 503, except any IP added to the
#      bypass list below. This works even if the Node app or Postgres is actually down —
#      Nginx serves the static file itself, with no dependency on the app.
# OFF: normal proxying to the app resumes.
#
# ONE-TIME SETUP (not automated — see deploy/maintenance-mode.sh's header comment for why):
# add a single line `include snippets/erp-maintenance.conf;` right after the `server_name`
# line inside the HTTPS (listen 443 ssl) server block of your live site config
# (/etc/nginx/sites-enabled/<name>) — NOT the plain :80 redirect block. Then `sudo nginx -t`
# before reloading.
set $erp_maintenance 0;
if (-f /home/deploy/apps/erp/deploy/MAINTENANCE_ON) {
    set $erp_maintenance 1;
}

# Bypass IPs — uncomment and edit (one line per IP) to keep your own access while this is on:
# if ($remote_addr = "203.0.113.5") { set $erp_maintenance 0; }

if ($erp_maintenance = 1) {
    return 503;
}

error_page 503 @erp_maintenance_page;
location @erp_maintenance_page {
    root /home/deploy/apps/erp/deploy;
    rewrite ^ /maintenance.html break;
    add_header Retry-After 1800 always;
}
