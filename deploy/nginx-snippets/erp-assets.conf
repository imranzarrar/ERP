# Long-lived caching for the build output under /assets/ (installed to
# /etc/nginx/snippets/erp-assets.conf by deploy/nginx-tuning.sh and `include`d in the site's
# server block, above `location / {`).
#
# Safe because every file Vite emits there has a content hash in its name (index-D_Fy9Ndl.js):
# a new build produces new names, so "cached for a year" can never serve stale code. index.html
# lives under `/`, is NOT matched here, and stays revalidated on every visit — that is what makes
# a new deploy visible immediately.
#
# proxy_hide_header drops the app's own "Cache-Control: public, max-age=0" for these files.
location /assets/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}
