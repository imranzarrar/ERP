# Response compression for the file types this app actually serves (installed to
# /etc/nginx/conf.d/erp-gzip.conf by deploy/nginx-tuning.sh, http context).
#
# Why this exists: Ubuntu's stock nginx.conf has `gzip on;` but leaves gzip_types commented out, so
# only text/html is compressed and the JS bundle, CSS and every /api/*.json response go out raw.
# Measured on this app: 2.1 MB JS bundle, 1.8 MB /api/state — several times smaller once compressed,
# which matters most for users far from the server or on weak connections.
#
# deploy/nginx-tuning.sh skips installing this file if the server's main nginx.conf already
# has gzip_types active (a duplicate directive makes `nginx -t` fail).
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css text/xml application/json application/javascript text/javascript application/xml application/xml+rss image/svg+xml font/ttf font/otf;
